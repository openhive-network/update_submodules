  - filename: .gitlab-ci.yml
    key_to_update: find_haf_image.variables.UPSTREAM_BRANCH
    value: $TAG
    when: tag
git@gitlab.syncad.com:hive/nft_tracker.git:
  ref: 'develop'
  automerge: true
# haf_stats: in haf_api_node since !244 (own `haf-stats` profile). Its CI builds
# on tag pipelines and mirrors the tagged images (publish_tag / publish_images),
# so a release tag here is what makes ${HIVE_API_NODE_VERSION} resolve for it.
git@gitlab.syncad.com:hive/haf_stats.git:
  ref: 'develop'
  automerge: true
  update_yaml:
  - filename: .gitlab-ci.yml
    key_to_update: find_haf_image.variables.UPSTREAM_BRANCH
    value: $TAG
    when: tag
# haf_fyp: tagged alongside the stack. NOTE its CI publishes images only from
# the default branch (SHA and `develop` tags); a tag pipeline builds nothing, so
# until haf_fyp gains tag publishing the release tag is a git tag only.
git@gitlab.syncad.com:hive/haf_fyp.git:
  ref: 'develop'
  automerge: true

# User interfaces
# block_explorer_ui pinned to the 1.28.6-rc14 commit for the 1.28.6 release:
# develop carries an auth-system overhaul (Issue #672) plus other features that
# are not appropriate for this patch release.  The pin makes the script tag
# 1.28.6 directly on the rc14 commit (no commit, no MR — BE-UI has no
# update_yaml rules and isn't referenced as a submodule by any other repo).
git@gitlab.syncad.com:hive/block_explorer_ui.git:
  ref: '10fcf8ee1b33fa5307c5819eea60de8d76ce49e8'
  create_merge_request: false
  automerge: false

git@gitlab.syncad.com:hive/denser.git:
  ref: 'develop'
  automerge: true
  update_yaml:
  - filename: '.gitlab-ci.yml'
    key_to_update: 'variables.HAF_COMMIT'
    submodule_referenced: 'git@gitlab.syncad.com:hive/haf.git'

